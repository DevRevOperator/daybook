name: Publish personal Daybook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify personal repository owner
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('cloud.config.json'));
          const expected = `${config.githubOwner}/${config.repository}`;
          if (process.env.GITHUB_REPOSITORY !== expected || process.env.GITHUB_REPOSITORY_OWNER_ID !== String(config.githubOwnerId)) throw new Error('Deployment is restricted to the configured personal account and repository.');
          JS
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
